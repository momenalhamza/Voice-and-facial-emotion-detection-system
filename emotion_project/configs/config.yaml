# =============================================================================
#  Multimodal Emotion Recognition — Hyperparameters
#  Every training script reads this file via src/utils/config.py
# =============================================================================

project:
  name: multimodal-emotion
  seed: 42
  num_classes: 5
  device: auto              # auto | cpu | cuda
  emotions: [Happy, Sad, Angry, Fearful, Neutral]

paths:
  data_raw_audio: data/raw/audio
  data_raw_faces: data/raw/faces
  data_processed: data/processed
  faces_tensor: data/processed/faces.pt
  audio_tensor: data/processed/audio.pt
  splits_dir: data/processed/splits
  checkpoints: checkpoints
  logs: logs

face:
  image_size: 48
  channels: 3               # convert grayscale → 3-channel for ResNet
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  backbone: resnet18
  embedding_dim: 256
  dropout: 0.3
  batch_size: 64
  epochs: 40
  lr: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 7

audio:
  sample_rate: 16000
  duration_seconds: 3.0
  n_mfcc: 40
  n_mels: 64
  n_fft: 1024
  hop_length: 512
  lstm_hidden: 256
  lstm_layers: 2
  bidirectional: true
  embedding_dim: 256
  dropout: 0.3
  batch_size: 64
  epochs: 50
  lr: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 8

fusion:
  type: late                # late | attention
  hidden_dim: 256
  dropout: 0.4
  batch_size: 32
  epochs: 30
  lr: 5.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 6
  freeze_backbones: false

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
